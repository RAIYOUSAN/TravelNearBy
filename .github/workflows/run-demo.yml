name: Run demo

on:
  push:
    branches: ["**"]

jobs:
  run-demo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run demo script
        run: python examples/demo.py
